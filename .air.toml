root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  entrypoint = "./tmp/server"

  include_ext = ["go", "env"]
  include_file = [".env"]

  exclude_dir = ["tmp", "bin", ".git", ".claude", "internal/db/migrations"]

  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  follow_symlink = false

  delay = 300

  send_interrupt = true
  kill_delay = "5s"

  stop_on_error = false
  log = "build-errors.log"

[log]
  time = false
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
