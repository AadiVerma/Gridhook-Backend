version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - sqlclosecheck
    - unconvert
    - misspell
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - gridhook.dev/connector-backend

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
