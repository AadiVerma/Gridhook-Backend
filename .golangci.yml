version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - noctx

    - errorlint
    - nilerr
    - contextcheck

    - gosec

    - unconvert
    - misspell
    - copyloopvar
    - durationcheck
    - makezero
    - predeclared
    - reassign
    - usestdlibvars
    - wastedassign

  settings:
    gosec:
      excludes:
        - G107
        - G404
    errorlint:
      errorf: true
      asserts: true
      comparison: true

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - gridhook.dev/connector-backend

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
